# docs_chain context: emulator-status
# Syncs the RK3588 A/B virtualisation emulator status docs
context: emulator-status
description: Emulator status doc chain
nodes:
  status_md:       { kind: markdown, path: docs/emulator/rk3588_ab_virt/Status.md }
  status_sum_md:   { kind: markdown, path: docs/emulator/rk3588_ab_virt/Status_Summary.md }
  status_html:     { kind: html,     path: docs/emulator/rk3588_ab_virt/Status.html }
  status_sum_html: { kind: html,     path: docs/emulator/rk3588_ab_virt/Status_Summary.html }
  status_pdf:      { kind: pdf,      path: docs/emulator/rk3588_ab_virt/Status.pdf }
  status_sum_pdf:  { kind: pdf,      path: docs/emulator/rk3588_ab_virt/Status_Summary.pdf }
edges:
  - { type: derive-from, from: status_md,     to: status_html,     transform: md2html }
  - { type: derive-from, from: status_html,   to: status_pdf,      transform: html2pdf }
  - { type: derive-from, from: status_sum_md, to: status_sum_html, transform: md2html }
  - { type: derive-from, from: status_sum_html, to: status_sum_pdf, transform: html2pdf }
transforms:
  md2html:  { builtin: pandoc-html }
  html2pdf: { builtin: weasyprint-pdf }
