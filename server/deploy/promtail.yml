# Helix OTA — Promtail log-shipping configuration
# Ships container logs to Loki for centralized log aggregation.
#
# Usage:
#   promtail --config.file=promtail.yml
#
# For production, uncomment the `loki` label matchers, set the correct
# Loki endpoint, and tighten the pipeline_stages to drop noisy debug lines.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Production: use HTTPS + basic auth
    # url: https://logs.helix.example/loki/api/v1/push
    # basic_auth:
    #   username: helix-ota
    #   password_file: /etc/promtail/loki-password

scrape_configs:
  - job_name: ota-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: ota-server
          __path__: /var/log/helix-ota/*.log

    # Production: tail the container's stdout/stderr via docker/podman log driver.
    # When using the journald or json-file driver on the container runtime:
    #
    # - job_name: ota-server-containers
    #   docker_sd_configs:
    #     - host: unix:///var/run/docker.sock
    #   relabel_configs:
    #     - source_labels: [__meta_docker_container_name]
    #       regex: /ota-server
    #       target_label: container
    #   pipeline_stages:
    #     - json:
    #         expressions:
    #           level: level
    #           msg: msg
    #           request_id: request_id
    #           time: time
    #     - timestamp:
    #         source: time
    #         format: RFC3339
