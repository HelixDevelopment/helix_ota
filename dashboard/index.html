<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helix OTA — Operator Dashboard</title>
    <meta
      name="description"
      content="Helix OTA operator dashboard — manage OTA releases, staged rollouts, deployments, device-fleet health, groups, and the audit log for Helix OTA."
    />
    <!--
      §11.4.190(B) SEO — this is an AUTHENTICATED internal operator console
      (every route past /login requires a session), not a public marketing
      surface, so it is intentionally excluded from search-engine indexing
      (mirrors public/robots.txt's blanket Disallow). Semantic HTML, a
      per-route <title> (dashboard/src/seo.ts), Open Graph / Twitter cards,
      and WCAG-AA remain in force for link-preview quality + usability — the
      "noindex" choice is a deliberate, honest application of the SEO mandate
      to a private tool, not a shortcut around it.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Helix OTA" />
    <meta property="og:title" content="Helix OTA — Operator Dashboard" />
    <meta
      property="og:description"
      content="Manage OTA releases, staged rollouts, deployments, device-fleet health, groups, and the audit log for Helix OTA."
    />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Helix OTA — Operator Dashboard" />
    <meta
      name="twitter:description"
      content="Manage OTA releases, staged rollouts, deployments, device-fleet health, groups, and the audit log for Helix OTA."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Helix OTA Operator Dashboard",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (browser-based)",
        "description": "Operator dashboard for managing OTA releases, staged rollouts, deployments, device-fleet health, groups, and the audit log for Helix OTA."
      }
    </script>
    <!--
      Runtime config injection point (design §3.2). At deploy time, a small
      inline script may set window.__HELIX_CONFIG__ = { apiBaseUrl: "..." }.
      No secrets are ever embedded here — the SPA holds only short-lived tokens.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
