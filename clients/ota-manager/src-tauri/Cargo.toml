[package]
name = "ota-manager"
version = "0.1.0"
description = "Helix OTA Manager — Desktop client for OTA update management"
authors = ["Helix Development"]
edition = "2021"

[lib]
name = "ota_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
