# clients/ota-manager/docker/nginx.prebuild.conf — OTA Manager SPA reverse-proxy config
# for the PREBUILT deployment (nginx:stable-alpine without brotli module).
#
# Serves the React SPA (static files from /usr/share/nginx/html) with:
#   - gzip compression (no brotli — stable-alpine image lacks the module)
#   - SPA fallback: every non-file route that is not an API call serves index.html
#   - Cache headers: 1y for content-hashed assets, no-cache for index.html
#   - Security headers: X-Frame-Options, X-Content-Type-Options, HSTS, CSP
#   - API proxy: /api/* forwarded to ota-server:8080

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # ---- Character set ----
    charset utf-8;

    # ---- Compression (gzip only — no brotli in stable-alpine) ---------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml application/wasm
               font/woff2 font/woff;

    # ---- Security headers ---------------------------------------------------
    add_header X-Frame-Options          "DENY"                   always;
    add_header X-Content-Type-Options   "nosniff"                always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://ota-server:8080; frame-ancestors 'none';" always;

    server_tokens off;

    # ---- Root & default index file --------------------------------------------
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- API reverse-proxy ---------------------------------------------------
    # Use resolver + variable to force runtime DNS resolution (podman-assigned
    # container IPs change on restart; proxy_pass with a hostname caches once).
    resolver 10.89.13.1 valid=10s;
    set $api_upstream http://ota-server:8080;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    # ---- Static asset serving with long cache ---------------------------------
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files  $uri =404;
    }

    # ---- SPA fallback ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    access_log /var/log/nginx/ota-manager-access.log;
    error_log  /var/log/nginx/ota-manager-error.log warn;
}
