# clients/ota-manager/docker/nginx.conf — OTA Manager SPA reverse-proxy config.
#
# Serves the React SPA (static files built to /usr/share/nginx/html) with:
#   - Brotli + gzip compression (negotiated; client preference wins)
#   - SPA fallback: every non-file route that is not an API call serves index.html
#   - Cache headers: 1y for content-hashed assets, no-cache for index.html
#   - Security headers: X-Frame-Options, X-Content-Type-Options, HSTS, CSP
#   - API proxy: /api/* forwarded to the ota-server backend
#     (http://ota-server:8080 in docker-compose context)
#
# This config is COPYed into the nginx image at /etc/nginx/conf.d/default.conf.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # ---- Character set ----
    charset utf-8;

    # ---- Compression ----------------------------------------------------------
    # Brotli (static + dynamic) takes priority over gzip when the client
    # advertises both. The nginx:stable-alpine image ships with the brotli module
    # from nginx 1.25+; if absent these directives are ignored (harmless).
    # Gzip is always available as fallback.
    brotli on;
    brotli_static on;          # pre-compressed .br files from pnpm build
    brotli_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml application/wasm
               font/woff2 font/woff;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml application/wasm
               font/woff2 font/woff;

    # ---- Security headers -----------------------------------------------------
    add_header X-Frame-Options          "DENY"                   always;
    add_header X-Content-Type-Options   "nosniff"                always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Content-Security-Policy — relaxed enough for the SPA dev-mode HMR and API
    # calls to the backend at the same origin.  Tighten per deployment.
    add_header Content-Security-Policy  "default-src 'self'; "
                                        "script-src 'self'; "
                                        "style-src 'self' 'unsafe-inline'; "
                                        "img-src 'self' data:; "
                                        "font-src 'self'; "
                                        "connect-src 'self' http://ota-server:8080; "
                                        "frame-ancestors 'none';"
                                        always;

    # Suppress the nginx version in error pages and Server response header.
    server_tokens off;

    # ---- Root & default index file --------------------------------------------
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- API reverse-proxy ----------------------------------------------------
    # Forward /api/* requests to the ota-server backend (docker-compose service
    # name "ota-server", port 8080).  When the SPA is served from the Go server's
    # embedded /manager path (server/internal/api/embed.go), this proxy block is
    # unused; it only applies to the standalone container deployment.
    location /api/ {
        proxy_pass http://ota-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — the ota-server handles long-poll deployments gracefully.
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    # ---- Static asset serving with long cache ---------------------------------
    # Content-hashed files (Vite outputs with [hash] in the filename) are
    # immutable — cache for 1 year.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files  $uri =404;
    }

    # ---- SPA fallback ---------------------------------------------------------
    # Any request that does not match a real file, is not an API call, and is a
    # GET serves index.html so the React router can resolve the path client-side.
    location / {
        try_files $uri $uri/ /index.html;

        # Never cache the fallback itself (the SPA shell).
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ---- Access & error logs --------------------------------------------------
    access_log /var/log/nginx/ota-manager-access.log;
    error_log  /var/log/nginx/ota-manager-error.log warn;
}
