# =============================================================================
# deploy/svord/nginx/hxota-proxy.conf — reverse proxy + static serving + TLS.
# -----------------------------------------------------------------------------
# Mounted read-only into the `proxy` (nginx:stable-alpine) service by
# compose.svord.yml. Routes:
#   hxota.dev  -> console/dashboards (ota-manager SPA + /dashboard) + /api/v1
#                 reverse-proxied to the ota-server control plane.
#   hxota.com  -> the marketing website (Angular dist).
# TLS certs come from the lets_encrypt submodule via https_certs.sh, mounted at
# /etc/nginx/certs/<domain>/{fullchain.pem,privkey.pem}.
#
# SCAFFOLD NOTE: domains are HelixOTA's own (hxota.dev/hxota.com); edit for a
# different site. The "hxota.dev regular-site redirect to hxota.com" behaviour is
# a QD decision (QD5) — see the commented block on the hxota.dev server.
# NOTE (§11.4.6): if the certs are not yet issued the TLS servers will fail to
# start; https_certs.sh must run first (or comment the 443 servers for HTTP-only
# staging).
# =============================================================================

# ---- unencrypted: health + ACME http-01 challenge + redirect to https --------
server {
    listen 80 default_server;
    server_name _;

    # Container-local health endpoint (compose healthcheck hits this).
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # ACME http-01 challenge webroot (lets_encrypt writes here via a shared vol).
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    # Everything else -> https (the canonical secure origin).
    location / { return 301 https://$host$request_uri; }
}

# ---- hxota.dev : console / dashboards + API reverse proxy --------------------
server {
    listen 443 ssl;
    http2 on;
    server_name hxota.dev www.hxota.dev;

    ssl_certificate     /etc/nginx/certs/hxota.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hxota.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # QD5 — "hxota.dev as a regular site REDIRECTS to hxota.com". Uncomment to make
    # a bare visit to hxota.dev bounce to the marketing site; keep commented to
    # serve the console SPA at the root (default). Operator decision.
    # location = / { return 302 https://hxota.com/; }

    # OTA control-plane API (reverse proxy to the Go server).
    location /api/v1/ {
        proxy_pass         http://ota-server:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Artifact blobs (optional: proxy to MinIO or serve a signed-URL redirect).
    location /artifacts/ {
        proxy_pass       http://minio:9000/;
        proxy_set_header Host $host;
    }

    # The operator console (ota-manager SPA) at the root.
    location / {
        root  /srv/console;
        try_files $uri $uri/ /index.html;
    }

    # The secondary dashboard surface under /dashboard.
    location /dashboard/ {
        alias /srv/dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
    }
}

# ---- hxota.com : marketing website ------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name hxota.com www.hxota.com;

    ssl_certificate     /etc/nginx/certs/hxota.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hxota.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root  /srv/website;
        try_files $uri $uri/ /index.html;
    }
}
