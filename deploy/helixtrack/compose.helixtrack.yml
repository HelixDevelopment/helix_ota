# HelixTrack Core Stack
# Multi-service stack for running the HelixTrack Core deployment from the
# helix_ota CONSUMER layer (§11.4.28).
#
# This compose file is HelixTrack-specific (its build contexts reference the
# sibling helix_track repo via ../helix_track/...). It lives HERE, in the
# consuming helix_ota project, NOT in the project-agnostic vasic-digital/containers
# submodule — the submodule stays fully decoupled / project-unaware / reusable
# (§11.4.28(B)). The consumer owns its project-specific deployment artifacts.
#
# distribute_stack.sh rsyncs this file to the remote as $REMOTE_DIR/containers/
# compose.helixtrack.yml alongside the build context at $REMOTE_DIR/helix_track/,
# so the ../helix_track/ relative paths below resolve correctly ON THE REMOTE.
#
# Usage (remote, via distribute_stack.sh):
#   bash scripts/distribute_stack.sh [--dry-run]
# Usage (local, manual):
#   podman compose -f deploy/helixtrack/compose.helixtrack.yml up -d
#   (relative ../helix_track/ paths resolve from deploy/helixtrack/ —
#    i.e. helix_ota/helix_track/ — when run from that directory)

services:
  # ============================================
  # HELIXTRACK CORE (Go Backend)
  # ============================================
  helixtrack-core:
    build:
      context: ../helix_track/core/Application
      dockerfile: Dockerfile
    container_name: helixtrack-core
    environment:
      HT_CONFIG: /config/default.json
      HT_SPACE_ROOT: /data/spaces/_default
      HT_DB_TYPE: sqlite
    ports:
      - "8080:8080"
    volumes:
      # Space data (per-project isolated databases + assets)
      - ../helix_track/spaces:/data/spaces
      # Core configuration
      - ../helix_track/core/Application/Configurations:/config
    healthcheck:
      # /health is the app's real liveness route; root `/` returns 404 (no route),
      # which made `podman ps` mislabel the healthy container "unhealthy" (real
      # deploy 2026-06-22, docs/qa/20260622-213843-distribute-thinker-green/).
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - helixtrack-net
    restart: unless-stopped
    command: ["./htCore", "--space-root=/data/spaces/_default"]

  # ============================================
  # POSTGRESQL (optional, production target)
  # ============================================
  helixtrack-postgres:
    image: postgres:16-alpine
    container_name: helixtrack-postgres
    environment:
      POSTGRES_DB: helixtrack
      POSTGRES_USER: helixtrack
      POSTGRES_PASSWORD: ${HT_PG_PASSWORD:-helixtrack_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixtrack -d helixtrack"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - helixtrack-net
    volumes:
      - helixtrack-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - production

networks:
  helixtrack-net:
    name: helixtrack-network
    driver: bridge

volumes:
  helixtrack-pg-data:
