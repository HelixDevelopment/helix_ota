version: "1.0"
last_updated: "2026-06-20T00:30:00Z"

signatures:
  # PWU-AB-1: A/B slot switch via U-Boot BOOT_ORDER
  - id: PWU-AB-1-SLOT-SWITCH
    component: "U-Boot A/B slot switch"
    description: >
      A/B slot switch via U-Boot BOOT_ORDER env var. Tests boot A,
      verifies slot A is active (HELIX_SLOTID=A), reboots to slot B
      via fw_setenv bootorder, verifies slot B active
      (HELIX_SLOTID=B, HELIX_ROOTDEV=/dev/vda3).
    check_command: >
      grep -q 'HELIX_SLOTID=B' docs/qa/20260611T094958Z-ab-slot-switch/verdict.txt
    expected_output: "HELIX_SLOTID=B  HELIX_ROOTDEV=/dev/vda3"
    layer: "RUNTIME-ON-CLEAN-TARGET"
    evidence_path: "docs/qa/20260611T094958Z-ab-slot-switch/"
    last_proven: "2026-06-11"
    determinism: "3/3"

  # PWU-AB-2: RAUC dd-apply to inactive slot
  - id: PWU-AB-2-RAUC-DD
    component: "RAUC dd-apply to inactive slot"
    description: >
      dd rootfs to inactive slot + fw_setenv BOOT_ORDER switch so
      guest boots the new slot post-reboot. Verifies
      HELIX_POSTSLOT=B, HELIX_DD_RC=0, HELIX_FWSET_RC=0.
    check_command: >
      grep -q 'HELIX_POSTSLOT=B' docs/qa/20260620T051026Z-ab-rauc-verity/verdict.txt
    expected_output: "HELIX_POSTSLOT=B, HELIX_DD_RC=0"
    layer: "RUNTIME-ON-CLEAN-TARGET"
    evidence_path: "docs/qa/20260620T051026Z-ab-rauc-verity/"
    last_proven: "2026-06-20"
    determinism: "3/3"

  # PWU-AB-3: U-Boot corrupt-slot auto-rollback
  - id: PWU-AB-3-ROLLBACK
    component: "U-Boot corrupt-slot auto-rollback"
    description: >
      bootcount > bootlimit triggers altbootcmd which swaps to the
      good slot. The ROLLBACK run booted from bad slot B and
      rolled back to good slot A (HELIX_SLOTID=A,
      HELIX_ROOTDEV=/dev/vda2), proving the rollback mechanism.
    check_command: >
      grep -q 'ROLLBACK' docs/qa/20260611T095918Z-ab-rollback/verdict.txt
    expected_output: "Run ROLLBACK (head was bad slot B, expect rolled-back to A): HELIX_SLOTID=A HELIX_ROOTDEV=/dev/vda2"
    layer: "RUNTIME-ON-CLEAN-TARGET"
    evidence_path: "docs/qa/20260611T095918Z-ab-rollback/"
    last_proven: "2026-06-11"
    determinism: "2/2"

